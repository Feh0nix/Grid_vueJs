<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoovyGrid · version premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F6; --sheet:#FFFFFF; --ink:#12161C; --mute:#6A7380;
  --rule:#E4E7EB; --tint:#F7F8FA; --accent:#233A78;
  --good:#1E7A55; --bad:#B3402A;
  --dock:#12161C; --dockfg:#F3F4F6;
  --ui:"Geist",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --shadow:0 1px 2px rgba(18,22,28,.06),0 14px 34px rgba(18,22,28,.12);
}
[data-theme=dark]{
  --paper:#0C0E11; --sheet:#13161A; --ink:#ECEEF1; --mute:#8A929E;
  --rule:#23272D; --tint:#171A1F; --accent:#9DB2FF;
  --good:#5CC49A; --bad:#F08A72;
  --dock:#ECEEF1; --dockfg:#0C0E11;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--ui);display:flex;flex-direction:column;overflow:hidden;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barre du haut */
.top{display:flex;align-items:center;gap:28px;padding:0 28px;height:56px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.logo{font-weight:600;font-size:16px;letter-spacing:-.025em}
.logo span{font-weight:400;color:var(--mute)}
.doc{color:var(--mute)}
.lens{display:flex;gap:22px;height:100%}
.lens button{color:var(--mute);height:100%;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.lens button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.sp{flex:1}
.kbtn{color:var(--mute);display:flex;gap:10px;align-items:center}
.kbtn kbd{font:12px var(--ui);padding:1px 7px;border:1px solid var(--rule);border-radius:5px}
.save{padding:8px 16px;border-radius:6px;background:var(--ink);color:var(--sheet);font-weight:500}

/* Page */
.sheet{flex:1;overflow:auto;padding:28px 28px 150px}
.paper{max-width:1040px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:40px 44px 36px}

/* Résumé, la seule phrase en grand */
.sum .fig{font:400 52px/1.05 var(--serif);letter-spacing:-.025em}
.sum .fig i{font-style:normal;font-size:28px;color:var(--mute);margin-left:6px}
.sum p{margin-top:10px;color:var(--mute);font-size:15px}
.sum p b{font-weight:500}
.sum .good{color:var(--good)} .sum .bad{color:var(--bad)}

.fbar{display:flex;gap:16px;margin:34px 0 10px;color:var(--mute);font-size:13px}
.fbar .what{color:var(--ink)} .fbar em{font-style:normal;color:var(--accent)}

/* Grille : seulement des filets horizontaux */
.grid{display:grid}
.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;border-bottom:1px solid var(--rule)}
.row.head{border-bottom-color:var(--ink)}
.row.head .h{display:flex;gap:8px;align-items:baseline;padding:10px 16px;color:var(--mute);font-size:13px}
.row.head .h.r{justify-content:flex-end}
.row.head .g{font-size:12px;opacity:.8}
.row.head .calc .g{color:var(--accent);opacity:1}
.cell{position:relative;min-height:52px;padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
.cell.num{align-items:flex-end}
.row:not(.head):not(.tot):hover{background:var(--tint)}
.n{font-variant-numeric:tabular-nums;font-size:15px}
.n i{font-style:normal;color:var(--mute);margin-left:4px;font-size:13px}
.gap{font-variant-numeric:tabular-nums;font-size:15px}
.gap.good{color:var(--good)} .gap.bad{color:var(--bad)} .gap.zero{color:var(--mute)}
.dv{position:relative;width:100%;max-width:120px;height:2px;margin-top:7px;background:var(--rule)}
.dv::before{content:"";position:absolute;left:50%;top:-3px;width:1px;height:8px;background:var(--mute);opacity:.5}
.dv span{position:absolute;top:0;height:100%}
.dv .good{right:50%;background:var(--good)} .dv .bad{left:50%;background:var(--bad)}
.cell.active{background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:3px;z-index:1}
.cell.active::after{content:"";position:absolute;right:-3px;bottom:-3px;width:6px;height:6px;background:var(--accent);border:1.5px solid var(--sheet)}
.cell input{width:100%;background:transparent;border:0;color:var(--ink);font:inherit;font-size:15px;outline:0}
.cell.num input{text-align:right}
.row.tot{border-bottom:0;border-top:1.5px solid var(--ink);margin-top:-1px}
.row.tot .cell{font-weight:500}
.row.tot .cell:first-child{font-family:var(--serif);font-size:17px}

/* Cartes : colonnes éditoriales, sans boîtes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px;margin-top:34px}
.card{border-top:1.5px solid var(--ink);padding-top:14px}
.card h3{font-weight:500;font-size:14px;color:var(--mute)}
.card .big{font:400 40px/1.1 var(--serif);letter-spacing:-.02em;margin:10px 0 14px}
.card .big i{font-style:normal;font-size:20px;color:var(--mute);margin-left:4px}
.card .foot{display:flex;justify-content:space-between;color:var(--mute);margin-top:12px;font-size:13px}
.card .dv{max-width:none}

/* Graphique */
.chart{margin-top:34px;display:grid;gap:26px}
.chart .lab{display:flex;justify-content:space-between;margin-bottom:10px}
.chart .t{height:6px;background:var(--rule);border-radius:3px;margin-bottom:6px}
.chart .t span{display:block;height:100%;border-radius:3px;transition:width .4s}
.chart .p span{background:var(--mute);opacity:.55} .chart .r span{background:var(--ink)}
.legend{display:flex;gap:20px;color:var(--mute);font-size:13px}
.legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:8px;vertical-align:1px}

/* Dock */
.dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:12px;background:var(--dock);color:var(--dockfg);box-shadow:var(--shadow)}
.dock .ctx{padding:0 14px 0 12px;opacity:.6;font-size:13px;white-space:nowrap}
.dock button{padding:8px 14px;border-radius:8px}
.dock button:hover{background:rgba(127,127,127,.22)}
.dock .go{background:var(--dockfg);color:var(--dock);font-weight:500}
.dock .go:hover{background:var(--dockfg);opacity:.9}

/* Tiroir */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,92vw);background:var(--sheet);border-left:1px solid var(--rule);padding:32px 28px;transform:translateX(105%);transition:transform .25s ease;z-index:10;overflow:auto;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer h2{font:400 26px/1.15 var(--serif);letter-spacing:-.015em;margin-bottom:6px}
.drawer .sub{color:var(--mute);margin-bottom:22px}
.drawer .formula{padding:14px 0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:8px;font-size:15px}
.drawer .src{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule)}
.drawer .close{position:absolute;top:20px;right:24px;color:var(--mute)}

/* Palette */
.veil{position:fixed;inset:0;background:rgba(12,14,17,.38);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:20}
.veil.open{display:flex}
.pal{width:min(560px,92vw);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;padding:18px 22px;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--ink);font:16px var(--ui);outline:0}
.pal ul{list-style:none;padding:6px;max-height:320px;overflow:auto}
.pal li{display:flex;justify-content:space-between;padding:10px 16px;border-radius:6px;cursor:pointer}
.pal li small{color:var(--mute)}
.pal li.on{background:var(--tint);box-shadow:inset 2px 0 0 var(--accent)}

@media (max-width:700px){
  .top{gap:16px;padding:0 16px}.doc,.kbtn{display:none}
  .sheet{padding:16px 12px 150px}.paper{padding:24px 18px}
  .sum .fig{font-size:40px}.dock .ctx{display:none}
  .row{grid-template-columns:1.2fr 1fr 1fr 1.1fr}.cell{padding:10px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="logo">Noovy<span>Grid</span></div>
  <div class="doc">Classeur de démonstration</div>
  <nav class="lens" aria-label="Vues">
    <button data-v="grid" aria-pressed="true">Grille</button>
    <button data-v="cards" aria-pressed="false">Cartes</button>
    <button data-v="chart" aria-pressed="false">Graphique</button>
  </nav>
  <div class="sp"></div>
  <button class="kbtn" id="openPal">Chercher ou agir <kbd>Ctrl K</kbd></button>
  <button class="save">Enregistrer</button>
</header>

<main class="sheet">
  <div class="paper">
    <section class="sum" id="sum"></section>
    <div class="fbar"><span id="where"></span><span class="what" id="what"></span></div>
    <div id="view"></div>
  </div>
</main>

<div class="dock" role="toolbar" aria-label="Actions sur la sélection">
  <span class="ctx" id="ctx"></span>
  <button id="bExplain">Expliquer</button>
  <button id="bSort">Trier par écart</button>
  <button class="go" id="bAdd">Ajouter une ligne</button>
</div>

<aside class="drawer" id="drawer" aria-label="Explication de la cellule"></aside>

<div class="veil" id="veil">
  <div class="pal">
    <input id="q" placeholder="Que voulez-vous faire ?" autocomplete="off">
    <ul id="list"></ul>
  </div>
</div>

<script>
const fr = n => n.toLocaleString("fr-FR");
const sg = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fr(Math.abs(n));
const initial = () => [{p:"Loyer",a:850,b:850},{p:"Courses",a:420,b:398},{p:"Transport",a:120,b:134}];
let rows = initial(), sel = {r:0,c:0}, view = "grid", last = null;
const colName = ["Poste","Prévu","Réel","Écart"];
const $ = id => document.getElementById(id);

const sums = () => {
  const a = rows.reduce((s,x)=>s+x.a,0), b = rows.reduce((s,x)=>s+x.b,0);
  return {a,b,e:b-a};
};
const cls = e => e>0 ? "bad" : e<0 ? "good" : "zero";
const maxGap = () => Math.max(1, ...rows.map(x=>Math.abs(x.b-x.a)));
const dv = (e,max) => `<div class="dv"><span class="${cls(e)}" style="width:${Math.min(50,Math.abs(e)/max*50)}%"></span></div>`;
const gapCell = (e,max) => `<span class="gap ${cls(e)}">${e===0?"0":sg(e)}</span>` + dv(e,max);
const money = v => `<span class="n">${fr(v)}<i>€</i></span>`;

function cellHTML(r,c){
  const t = sums();
  if (r === rows.length){
    if (c === 0) return "Total";
    if (c === 1) return `<span class="n" data-t="a">${fr(t.a)}<i>€</i></span>`;
    if (c === 2) return `<span class="n" data-t="b">${fr(t.b)}<i>€</i></span>`;
    return `<span class="gap ${cls(t.e)}">${t.e===0?"0":sg(t.e)}</span>`;
  }
  const x = rows[r];
  if (c === 0) return x.p;
  if (c === 1) return money(x.a);
  if (c === 2) return money(x.b);
  return gapCell(x.b-x.a, maxGap());
}

function renderSummary(){
  const t = sums();
  const phrase = t.e<0 ? `<span class="good">${fr(-t.e)} € sous le prévu</span>` :
                 t.e>0 ? `<span class="bad">${fr(t.e)} € au-dessus du prévu</span>` : `<b>pile sur le prévu</b>`;
  $("sum").innerHTML = `<div class="fig" data-f>${fr(t.b)}<i>€</i></div><p>dépensés ce mois, ${phrase} (${fr(t.a)} €).</p>`;
}

function renderGrid(){
  const glyph = ["Aa","€","€","ƒ"];
  let h = `<div class="grid"><div class="row head">` +
    colName.map((n,i)=>`<div class="h ${i>0?"r":""} ${i===3?"calc":""}"><span class="g">${glyph[i]}</span>${n}</div>`).join("") + `</div>`;
  for (let r = 0; r <= rows.length; r++){
    h += `<div class="row ${r===rows.length?"tot":""}">`;
    for (let c = 0; c < 4; c++){
      const on = sel.r===r && sel.c===c;
      h += `<div class="cell ${c>0?"num":""} ${on?"active":""}" data-r="${r}" data-c="${c}">${cellHTML(r,c)}</div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

function renderCards(){
  const m = maxGap();
  return `<div class="cards">` + rows.map(x=>`
    <div class="card"><h3>${x.p}</h3>
      <div class="big">${fr(x.b)}<i>€</i></div>
      ${dv(x.b-x.a,m)}
      <div class="foot"><span>Prévu ${fr(x.a)} €</span><span class="gap ${cls(x.b-x.a)}">${x.b===x.a?"à l’équilibre":sg(x.b-x.a)+" €"}</span></div>
    </div>`).join("") + `</div>`;
}

function renderChart(){
  const max = Math.max(...rows.map(x=>Math.max(x.a,x.b)),1);
  return `<div class="chart"><div class="legend"><span><i style="background:var(--mute);opacity:.55"></i>Prévu</span><span><i style="background:var(--ink)"></i>Réel</span></div>` +
    rows.map(x=>`<div><div class="lab"><span>${x.p}</span><span class="gap ${cls(x.b-x.a)}">${x.b===x.a?"à l’équilibre":sg(x.b-x.a)+" €"}</span></div>
      <div class="t p"><span style="width:${x.a/max*100}%"></span></div><div class="t r"><span style="width:${x.b/max*100}%"></span></div></div>`).join("") + `</div>`;
}

function render(){
  renderSummary();
  $("view").innerHTML = view==="grid" ? renderGrid() : view==="cards" ? renderCards() : renderChart();
  document.querySelectorAll(".lens button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===view));
  info();
  const t = sums();
  if (last){
    if (last.b!==t.b){
      tween(document.querySelector("[data-f]"),last.b,t.b,"");
      const el = document.querySelector("[data-t=b]"); if (el) tween(el,last.b,t.b,"");
    }
    if (last.a!==t.a){ const el = document.querySelector("[data-t=a]"); if (el) tween(el,last.a,t.a,""); }
  }
  last = t;
}

function tween(el,from,to){
  if (!el) return;
  const unit = el.dataset.f !== undefined ? "<i>€</i>" : "<i>€</i>";
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1,(now-t0)/350), v = Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    el.innerHTML = fr(v)+unit;
    if (k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function info(){
  const {r,c} = sel, tot = r===rows.length;
  const who = tot ? "Total" : rows[r].p;
  $("where").textContent = `${colName[c]} · ${who}`;
  let w;
  if (c===3) w = tot ? "= <em>Total réel</em> − <em>Total prévu</em>" : "= <em>Réel</em> − <em>Prévu</em>";
  else if (tot && c>0) w = `= SOMME(<em>${colName[c]}</em>)`;
  else w = tot ? "Total" : String(c===0 ? rows[r].p : rows[r][c===1?"a":"b"]);
  $("what").innerHTML = w;
  $("ctx").textContent = `${colName[c]} · ${who}`;
}

/* Sélection, édition, clavier */
function select(r,c){ sel = {r:Math.max(0,Math.min(rows.length,r)), c:Math.max(0,Math.min(3,c))}; render(); }

function edit(){
  const {r,c} = sel;
  if (view!=="grid" || r===rows.length || c===3) return;
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  const key = ["p","a","b"][c], old = rows[r][key];
  el.innerHTML = `<input value="${old}" aria-label="Modifier la cellule">`;
  const inp = el.querySelector("input"); inp.focus(); inp.select();
  let done = false;
  const end = ok => {
    if (done) return; done = true;
    if (ok){
      if (c===0) rows[r].p = inp.value.trim() || old;
      else { const v = parseFloat(inp.value.replace(/\s/g,"").replace(",",".")); if (!isNaN(v)) rows[r][key] = v; }
    }
    render();
  };
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){e.preventDefault();end(true);} if(e.key==="Escape") end(false); });
  inp.addEventListener("blur", ()=>end(true));
}

$("view").addEventListener("click", e=>{ const c = e.target.closest(".cell"); if (c) select(+c.dataset.r, +c.dataset.c); });
$("view").addEventListener("dblclick", e=>{ if (e.target.closest(".cell")) edit(); });

document.addEventListener("keydown", e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPal(); return; }
  if (e.key==="Escape"){ $("drawer").classList.remove("open"); closePal(); }
  if (e.target.tagName==="INPUT" || view!=="grid") return;
  const k = e.key;
  if (k==="ArrowDown") select(sel.r+1,sel.c);
  else if (k==="ArrowUp") select(sel.r-1,sel.c);
  else if (k==="ArrowLeft") select(sel.r,sel.c-1);
  else if (k==="ArrowRight"||k==="Tab") select(sel.r,sel.c+1);
  else if (k==="Enter") edit();
  else return;
  e.preventDefault();
});

/* Actions */
const addRow = () => { view="grid"; rows.push({p:"Nouvelle ligne",a:0,b:0}); sel={r:rows.length-1,c:0}; render(); edit(); };
const sortGap = () => { rows.sort((x,y)=>(y.b-y.a)-(x.b-x.a)); sel={r:0,c:3}; render(); };
const setView = v => { view = v; render(); };
const theme = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme==="dark" ? "" : "dark"; };

function explain(){
  const {r,c} = sel, tot = r===rows.length, d = $("drawer");
  let title, sub, formula, src = "";
  if (tot){
    title = `Total · ${colName[c]}`; sub = "Calculé à partir de toutes les lignes.";
    formula = c===3 ? "= Total réel − Total prévu" : c===0 ? "Libellé" : `= SOMME(${colName[c]})`;
    if (c>0) src = rows.map(x=>`<div class="src"><span>${x.p}</span><span>${c===3?sg(x.b-x.a):fr(c===1?x.a:x.b)}</span></div>`).join("");
  } else if (c===3){
    const x = rows[r]; title = `Écart · ${x.p}`; sub = "Colonne calculée, jamais saisie à la main.";
    formula = "= Réel − Prévu";
    src = `<div class="src"><span>Réel</span><span>${fr(x.b)}</span></div><div class="src"><span>Prévu</span><span>${fr(x.a)}</span></div><div class="src"><span>Résultat</span><span>${sg(x.b-x.a)}</span></div>`;
  } else {
    title = `${colName[c]} · ${rows[r].p}`; sub = "Valeur saisie directement.";
    formula = c===0 ? rows[r].p : fr(rows[r][c===1?"a":"b"]) + " €";
    src = `<div class="src"><span>Utilisée dans</span><span>Écart, Total</span></div>`;
  }
  d.innerHTML = `<button class="close" id="cl">Fermer</button><h2>${title}</h2><p class="sub">${sub}</p><div class="formula">${formula}</div>${src}`;
  d.classList.add("open"); $("cl").onclick = () => d.classList.remove("open");
}

$("bAdd").onclick = addRow; $("bSort").onclick = sortGap; $("bExplain").onclick = explain;
document.querySelectorAll(".lens button").forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* Palette */
const cmds = [
  {l:"Ajouter une ligne", h:"Édition", run:addRow},
  {l:"Trier par dépassement", h:"Données", run:sortGap},
  {l:"Expliquer la cellule", h:"Comprendre", run:explain},
  {l:"Afficher la grille", h:"Vue", run:()=>setView("grid")},
  {l:"Afficher les cartes", h:"Vue", run:()=>setView("cards")},
  {l:"Afficher le graphique", h:"Vue", run:()=>setView("chart")},
  {l:"Basculer le thème sombre", h:"Apparence", run:theme},
  {l:"Réinitialiser les données", h:"Données", run:()=>{rows=initial();sel={r:0,c:0};render();}}
];
let shown = [], idx = 0;
function drawList(){
  const f = $("q").value.toLowerCase();
  shown = cmds.filter(c=>c.l.toLowerCase().includes(f)); idx = 0;
  $("list").innerHTML = shown.map((c,i)=>`<li class="${i===0?"on":""}" data-i="${i}">${c.l}<small>${c.h}</small></li>`).join("") || `<li><small>Aucune action ne correspond.</small></li>`;
}
function openPal(){ $("veil").classList.add("open"); $("q").value=""; drawList(); $("q").focus(); }
function closePal(){ $("veil").classList.remove("open"); }
function mark(){ [...$("list").children].forEach((li,i)=>li.classList.toggle("on",i===idx)); }
$("openPal").onclick = openPal;
$("veil").addEventListener("mousedown", e=>{ if (e.target===$("veil")) closePal(); });
$("q").addEventListener("input", drawList);
$("q").addEventListener("keydown", e=>{
  if (e.key==="ArrowDown"){ e.preventDefault(); idx=Math.min(shown.length-1,idx+1); mark(); }
  if (e.key==="ArrowUp"){ e.preventDefault(); idx=Math.max(0,idx-1); mark(); }
  if (e.key==="Enter" && shown[idx]){ const c = shown[idx]; closePal(); c.run(); }
});
$("list").addEventListener("click", e=>{ const li = e.target.closest("li[data-i]"); if(li){ const c = shown[+li.dataset.i]; closePal(); c.run(); } });

render();
</script>
