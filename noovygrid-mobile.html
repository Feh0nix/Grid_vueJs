<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf1f7">
<title>NoovyGrid – Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f7;--card:#fff;--ink:#1b2433;--mute:#64708a;--line:#e5e9f1;--head:#f4f6fa;
  --blue:#3d6df5;--blue-d:#2f58d6;--green:#2ec27e;--green-d:#0f8a55;--tint:#e4f7ee;
  --shadow:0 1px 2px rgba(27,36,51,.05),0 8px 24px rgba(27,36,51,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}

/* en-tête */
.top{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 8px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--green)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3d6df5,#2ec27e);display:grid;place-items:center;box-shadow:0 4px 10px rgba(61,109,245,.35)}
.save{border:0;background:var(--blue);color:#fff;font-weight:600;font-size:14px;height:40px;padding:0 18px;border-radius:12px;box-shadow:0 4px 12px rgba(61,109,245,.35);transition:background .15s,transform .1s}
.save:hover{background:var(--blue-d)}.save:active{transform:scale(.97)}
.meta{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.meta b{font-weight:600;font-size:15px;white-space:nowrap}
.meta span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;min-width:0}
.meta span:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.meta span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* barre de formule */
.fx{display:flex;align-items:center;gap:8px;padding:8px}
.ref{min-width:52px;height:40px;border-radius:10px;background:var(--head);display:grid;place-items:center;font-weight:600;font-size:13px}
.fx svg{flex:none;color:var(--blue)}
.fx input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}
.fx input:focus{outline:2px solid var(--blue);border-color:transparent}

/* grille */
.gridwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0}
table{border-collapse:separate;border-spacing:0;font-size:14px;table-layout:fixed;width:max-content}
th,td{height:38px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td{width:92px;max-width:92px;background:#fff;position:relative;cursor:cell}
td:first-of-type{width:116px;max-width:116px}
th{background:var(--head);color:var(--mute);font-weight:500;font-size:12px;position:sticky;z-index:2;text-align:center;padding:0}
thead th{top:0;height:34px}
tbody th{left:0;width:36px;min-width:36px}
th.k{left:0;z-index:3;width:36px}
th.on{background:var(--tint);color:var(--green-d);font-weight:700}
td.n{text-align:right}
td.sel{box-shadow:inset 0 0 0 2px var(--green);z-index:1}
td.sel:after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;background:var(--green);border:1.5px solid #fff;border-radius:2px}

/* onglets */
.tabs{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:#fafbfd;overflow-x:auto}
.tabs button{flex:none;height:36px;border:0;background:none;border-radius:10px;padding:0 14px;font-size:13px;font-weight:500;color:var(--mute)}
.tabs button.cur{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(27,36,51,.14)}
.tabs .add{width:36px;padding:0;font-size:20px;line-height:1}

/* barre d'outils */
.tools{display:flex;justify-content:space-between;padding:6px}
.tools button{width:48px;height:48px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:#3b465c;transition:background .15s}
.tools button:hover{background:var(--head)}
.tools button.act{background:var(--tint);color:var(--green-d)}
.tools button:active{transform:scale(.94)}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;transition:transform .25s;box-shadow:var(--shadow)}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="card top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.5h17M3.5 15h17M9.5 3.5v17"/></svg></span>
      <span>Noovy<i>Grid</i></span>
    </div>
    <button class="save" id="save">Enregistrer</button>
    <div class="meta"><b>Classeur de démonstration</b><span><em>Chargé depuis le serveur</em></span></div>
  </header>

  <section class="card fx" aria-label="Barre de formule">
    <div class="ref" id="ref">A1</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4c-3 0-3 2-4 6s-1 6-4 6M8 10h7M13 14l5 6M18 14l-5 6"/></svg>
    <input id="formula" aria-label="Contenu de la cellule" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
  </section>

  <section class="card gridwrap">
    <div class="scroll" id="scroll"><table id="grid"></table></div>
    <nav class="tabs" id="tabs" aria-label="Feuilles"></nav>
  </section>

  <section class="card tools" aria-label="Mise en forme">
    <button id="bold" aria-label="Gras"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z"/></svg></button>
    <button id="italic" aria-label="Italique"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 4h-9M14 20H5M15 4L9 20"/></svg></button>
    <button id="align" aria-label="Alignement"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h16"/></svg></button>
    <button id="fill" aria-label="Couleur de fond"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l7-7 7 7-7 7zM19 15s2 2.2 2 3.5a2 2 0 01-4 0c0-1.300 2-3.500 2-3.500z"/></svg></button>
    <button id="sum" aria-label="Somme automatique"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5H6l6 7-6 7h12"/></svg></button>
    <button id="clear" aria-label="Effacer la cellule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
  </section>
</main>
<div class="toast" id="toast" role="status">Classeur enregistré</div>

<script>
const COLS=8, ROWS=40, KEY='noovygrid-mobile-v1';
const FILLS=['','#fff3c4','#d8f5e6','#dbe7ff','#ffe1e1'], ALIGN=['','left','center','right'];
let sheets=[{n:'Budget',d:{A1:'Poste',B1:'Prévu',C1:'Réel',A2:'Loyer',B2:'850',C2:'850',A3:'Courses',B3:'420',C3:'398',A4:'Transport',B4:'120',C4:'134',A6:'Total',B6:'=SOMME(B2:B4)',C6:'=SOMME(C2:C4)'},s:{A1:{b:1},B1:{b:1},C1:{b:1},A6:{b:1},B6:{b:1},C6:{b:1}}}];
let cur=0, sel='A1';
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.length)sheets=s}catch(e){}

const $=id=>document.getElementById(id), S=()=>sheets[cur];
const L=c=>String.fromCharCode(65+c), cid=(c,r)=>L(c)+(r+1);
const parse=id=>{const m=id.match(/^([A-Z]+)(\d+)$/);return[m[1].charCodeAt(0)-65,+m[2]]};

function num(id,dep){const v=calc(id,dep+1);return typeof v==='number'?v:(parseFloat(v)||0)}
function calc(id,dep=0){
  const raw=S().d[id]??'';
  if(dep>20)return'#CYCLE';
  if(raw[0]!=='='){const n=Number(raw.replace(',','.'));return raw.trim()!==''&&!isNaN(n)?n:raw}
  const e=raw.slice(1).toUpperCase()
    .replace(/(?:SOMME|SUM)\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,a,b)=>{
      const[x1,y1]=parse(a),[x2,y2]=parse(b);let t=0;
      for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)t+=num(cid(x,y-1),dep);
      return t})
    .replace(/[A-Z]+\d+/g,r=>num(r,dep));
  if(!/^[\d+\-*/().\s]+$/.test(e))return'#ERREUR';
  try{const v=Function('return('+e+')')();return isFinite(v)?Math.round(v*100)/100:'#ERREUR'}catch{return'#ERREUR'}
}

function render(){
  const sc=$('scroll'),t=sc.scrollTop,l=sc.scrollLeft,d=S().d,st=S().s;
  let h='<thead><tr><th class="k"></th>';
  for(let c=0;c<COLS;c++)h+=`<th>${L(c)}</th>`;
  h+='</tr></thead><tbody>';
  for(let r=0;r<ROWS;r++){
    h+=`<tr><th>${r+1}</th>`;
    for(let c=0;c<COLS;c++){
      const id=cid(c,r),v=calc(id),s=st[id]||{};
      const css=(s.b?'font-weight:700;':'')+(s.i?'font-style:italic;':'')+(s.f?`background:${s.f};`:'')+(s.a?`text-align:${s.a};`:'');
      h+=`<td data-id="${id}" class="${typeof v==='number'?'n':''}" style="${css}">${v===''?'':String(v).replace(/</g,'&lt;')}</td>`;
    }
    h+='</tr>';
  }
  $('grid').innerHTML=h+'</tbody>';
  sc.scrollTop=t;sc.scrollLeft=l;
  renderTabs();select(sel,false);
}
function renderTabs(){
  $('tabs').innerHTML=sheets.map((s,i)=>`<button class="${i===cur?'cur':''}" data-i="${i}">${s.n}</button>`).join('')+'<button class="add" aria-label="Ajouter une feuille">+</button>';
}
function select(id,scroll=true){
  sel=id;
  document.querySelectorAll('.sel,.on').forEach(e=>e.classList.remove('sel','on'));
  const td=document.querySelector(`[data-id="${id}"]`);if(!td)return;
  const[c,r]=parse(id);
  td.classList.add('sel');
  document.querySelector(`thead th:nth-child(${c+2})`).classList.add('on');
  td.parentNode.firstChild.classList.add('on');
  $('ref').textContent=id;$('formula').value=S().d[id]??'';
  const s=S().s[id]||{};
  $('bold').classList.toggle('act',!!s.b);$('italic').classList.toggle('act',!!s.i);
  $('align').classList.toggle('act',!!s.a);$('fill').classList.toggle('act',!!s.f);
  if(scroll)td.scrollIntoView({block:'nearest',inline:'nearest'});
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(sheets))}catch(e){}}
function commit(v){
  if(v===(S().d[sel]??''))return;
  if(v==='')delete S().d[sel];else S().d[sel]=v;
  render();
}
function style(k,v){
  const s=S().s[sel]=S().s[sel]||{};
  if(v===undefined||v===''||v===0)delete s[k];else s[k]=v;
  render();
}

$('grid').addEventListener('click',e=>{const td=e.target.closest('td');if(td)select(td.dataset.id)});
$('formula').addEventListener('change',e=>commit(e.target.value));
$('formula').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  commit(e.target.value);
  const[c,r]=parse(sel);if(r<ROWS)select(cid(c,r));
  e.target.blur();
});
$('bold').onclick=()=>style('b',(S().s[sel]||{}).b?0:1);
$('italic').onclick=()=>style('i',(S().s[sel]||{}).i?0:1);
$('align').onclick=()=>style('a',ALIGN[(ALIGN.indexOf((S().s[sel]||{}).a||'')+1)%ALIGN.length]);
$('fill').onclick=()=>style('f',FILLS[(FILLS.indexOf((S().s[sel]||{}).f||'')+1)%FILLS.length]);
$('clear').onclick=()=>{delete S().d[sel];delete S().s[sel];render()};
$('sum').onclick=()=>{
  const[c,r]=parse(sel);let y=r-1;
  while(y>=1&&typeof calc(cid(c,y-1))==='number'&&(S().d[cid(c,y-1)]??'')!=='')y--;
  if(y+1<=r-1){S().d[sel]=`=SOMME(${L(c)}${y+1}:${L(c)}${r-1})`;render()}
  else{$('formula').focus()}
};
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('add')){sheets.push({n:'Feuille '+(sheets.length+1),d:{},s:{}});cur=sheets.length-1}
  else cur=+b.dataset.i;
  sel='A1';render();
});
$('save').onclick=()=>{
  persist();const t=$('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
};
render();
</script>
</body>
</html>
